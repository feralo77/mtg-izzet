name: Actualizar datos desde las carpetas

# Flujo ÚNICO de datos (carpeta-céntrico). Cada día lee las carpetas Logs_<nick> del
# Drive (logs + hoja "Partidas — <nick>"), empareja apuntes con partidas y regenera
# registro.csv y games.csv, commiteándolos si cambian. El robot SOLO lee en Google.
# También se puede lanzar a mano (Actions -> Run workflow), incluso desde una rama.
# LANZADO A MANO (el botón "Actualizar datos" del dashboard) regenera además la META
# de mtgtop8: una sola pulsación refresca TODO. La corrida diaria de las 06:00 no toca
# la meta (esa sigue con su propio cron cada 2 días, para no machacar mtgtop8).
on:
  schedule:
    - cron: "0 6 * * *"      # cada día a las 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: true

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install --quiet google-api-python-client google-auth

      - name: Parsear carpetas y regenerar registro.csv + games.csv (+ listas nuevas)
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID }}
          MTG_FOLDER_ID: ${{ secrets.MTG_FOLDER_ID }}
        run: python automation/pipeline.py

      # Aviso, NO barrera: un corte de Scryfall no debe tumbar el pipeline de datos.
      # Nació de una sesión (30-jul) en la que se sospechó que 'Boomerang Basics' y
      # 'Flashback' eran erratas: resultaron ser cartas reales de sets nuevos. A ojo no
      # se distingue una errata de una carta que no conoces; Scryfall sí.
      - name: Comprobar que los nombres de carta de listas/ existen (aviso)
        continue-on-error: true
        run: python automation/validar_listas.py --aviso

      - name: Regenerar el comparador de listas (solo si algún .txt cambió)
        run: |
          if [[ -n "$(git status --porcelain -- 'listas/*.txt')" ]]; then
            node scripts/comparar_listas.mjs --date "$(date -u +%F)"
          else
            echo "Sin listas nuevas."
          fi

      - name: Regenerar la meta de mtgtop8 (solo en lanzamiento manual — el botón refresca TODO)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/meta_mtgtop8.mjs --out meta --milista meta/mi-75.json --date "$(date +%F)"

      # El radar cruza el campo global, la liga y el récord de Fer para sacar alarmas
      # ("este mazo sube y lo pierdes"). Tiene su propio cron cada 4 días; aquí corre
      # también porque el botón "Actualizar datos" refresca TODO de una vez.
      - name: Regenerar el radar de metajuego
        run: node scripts/radar_meta.mjs --out meta --hoy "$(date -u +%F)"

      # OJO: la lista de rutas tiene que incluir TODO lo que escribe el pipeline. Si se
      # queda algo fuera, ese fichero se queda sin commitear y el `git pull --rebase` de
      # abajo aborta con "You have unstaged changes" — el robot parsea bien y luego no
      # sube nada. Pasó el 15-sep-2026 al estrenar archivo/: se añadió al pipeline y no
      # aquí. Al añadir una salida nueva al pipeline, añadirla también en estas dos líneas.
      - name: Commitear si hay cambios
        run: |
          RUTAS="registro.csv games.csv scouting.csv esperando.json listas meta archivo"
          if [[ -n "$(git status --porcelain -- $RUTAS)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- $RUTAS
            git commit -m "Datos: registro, games, scouting, listas y meta desde el robot"
            # otro robot (p. ej. el de meta) puede haber subido mientras corríamos:
            # rebasar antes de empujar evita el push rechazado del 27-jul
            git pull --rebase
            git push
            echo "Datos actualizados y subidos."
          else
            echo "Sin cambios en los datos."
          fi
          # Red de seguridad: si el pipeline escribiera algo que no está en RUTAS, el
          # rebase de arriba habría fallado. Que se vea en el log en vez de morir mudo.
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::warning::El robot dejó ficheros sin commitear (fuera de RUTAS):"
            git status --porcelain
          fi
